[package]
name = "imposter"
version = "0.0.0"
edition = "2021"

[dependencies]
arrayvec = "0.7.4"
rand = "0.9.2"
imposter-nnue-arch = { path = "imposter-nnue-arch" }

[build-dependencies]
imposter-nnue-arch = { path = "imposter-nnue-arch" }

[[bin]]
name = "imposter"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[features]
tuning = []
measurements = []
avx2 = []
avx512 = []
track_activations = []
